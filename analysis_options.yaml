# Static analysis config. Run with `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - ios/**
    - macos/**
    - windows/**
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - android/**
    - web/**
    - linux/**
  errors:
    # Generated code is excluded above; anything left is ours and should be clean.
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
    unawaited_futures: true
    prefer_const_constructors: true
    prefer_final_locals: true
    directives_ordering: true
    require_trailing_commas: true
    # Off deliberately: Dart has no private named parameters, so a class with
    # private fields and a named constructor — the common shape for injected
    # dependencies — can never satisfy this rule.
    prefer_initializing_formals: false
